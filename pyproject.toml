[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isubing"
version = "1.0.0"
description = "A fast, multithreaded TCP port scanner with service detection and logging."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Lucas Sogaray" }
]
keywords = ["port scanner", "network", "security", "tcp", "scanner"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lucassogarayDA/isub"
Repository = "https://github.com/lucassogarayDA/isub"
Issues = "https://github.com/lucassogarayDA/isub/issues"

[project.scripts]
isub = "isub.cli:main"
